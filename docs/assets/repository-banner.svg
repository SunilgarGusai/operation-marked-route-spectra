<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" role="img" aria-labelledby="ttl desc">
<title id="ttl">Operation-marked eccentricity-weighted route spectra</title>
<desc id="desc">Deep-blue scientific banner with title, two-colour schematic of a layered directed acyclic graph, and a distinction between ordinary routes and eccentricity-weighted routes. Diagram is illustrative, not an exact witness.</desc>
