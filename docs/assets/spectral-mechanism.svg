<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title description">
<title id="title">From operation-marked directed routes to eccentricity-weighted spectral analysis</title>
<desc id="description">Three stages. Count directed paths, split routes by operation, and weight route matrices using support-graph eccentricities. The paper compares full spectra for the resulting operators.</desc>
<rect width="1180" height="360" rx="18" fill="#f8fbfd"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="42" y="45" font-size="22" font-weight="700" fill="#172c44">From directed routes to weighted spectra</text>
<text x="42" y="71" font-size="14" fill="#526d80">Structural definition  →  operation-resolved routes  →  eccentricity-sensitive spectral comparison</text>
</g>
<g>
<rect x="42" y="105" width="329" height="202" rx="15" fill="#fff" stroke="#b5cad5" stroke-width="1.5"/>
<rect x="425" y="105" width="329" height="202" rx="15" fill="#fff" stroke="#b5cad5" stroke-width="1.5"/>
<rect x="808" y="105" width="329" height="202" rx="15" fill="#fff" stroke="#b5cad5" stroke-width="1.5"/>
<circle cx="73" cy="138" r="15" fill="#0e5573"/><text x="73" y="143" font-size="13" fill="white" text-anchor="middle" font-family="Arial" font-weight="700">1</text>
<circle cx="456" cy="138" r="15" fill="#0e5573"/><text x="456" y="143" font-size="13" fill="white" text-anchor="middle" font-family="Arial" font-weight="700">2</text>
<circle cx="839" cy="138" r="15" fill="#0e5573"/><text x="839" y="143" font-size="13" fill="white" text-anchor="middle" font-family="Arial" font-weight="700">3</text>
<g font-family="Arial,Helvetica,sans-serif" fill="#173147">
<text x="98" y="144" font-weight="700" font-size="17">Directed route operator</text>
<text x="481" y="144" font-weight="700" font-size="17">Operation-marked routes</text>
<text x="864" y="144" font-weight="700" font-size="17">Eccentricity weighting</text>
<text x="72" y="194" font-size="27" font-weight="700">T = (I − U)⁻¹ − I</text>
<text x="72" y="224" font-size="14" fill="#5b7182">Finite series for acyclic U</text>
<text x="455" y="193" font-size="26" font-weight="700">Cα, Cβ</text>
<text x="455" y="223" font-size="14" fill="#5b7182">Symmetric marked-route matrices</text>
<text x="840" y="193" font-size="23" font-weight="700">Kω = Dε Cω + Cω Dε</text>
<text x="840" y="223" font-size="14" fill="#5b7182">Dε: support eccentricity diagonal</text>
<text x="72" y="269" font-size="13" fill="#526d80">Input: operation-labelled DAG</text>
<text x="455" y="269" font-size="13" fill="#526d80">Controls: operation-specific spectra</text>
<text x="840" y="269" font-size="13" fill="#526d80">Target: weighted spectral distinctions</text>
</g>
<path d="M377 199 L420 199" stroke="#148677" stroke-width="3"/><path d="M408 192 L421 199 L408 206" fill="none" stroke="#148677" stroke-width="3"/>
<path d="M760 199 L803 199" stroke="#148677" stroke-width="3"/><path d="M791 192 L804 199 L791 206" fill="none" stroke="#148677" stroke-width="3"/>
<text x="589" y="331" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" fill="#60798a">The verification code checks exact characteristic-polynomial identities, not only floating-point eigenvalues.</text>
</g>
</svg>